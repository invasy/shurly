apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shurly.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shurly.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      {{- include "shurly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "shurly.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "shurly.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.migrate.enabled }}
      # Gate the API on schema readiness: run Alembic before serving traffic.
      # `alembic upgrade head` is idempotent -- it only applies unapplied
      # revisions, so it is safe across replicas and on rolling restarts.
      initContainers:
        - name: migrate
          image: {{ include "shurly.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "shurly.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "shurly.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.service.port | quote }}
            - "--proxy-headers"
            - "--forwarded-allow-ips"
            - "*"
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "shurly.env" . | nindent 12 }}
          {{- include "shurly.probes" . | nindent 8 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
