[alembic]
# Timezone for the "now()" function used within the MIGRATIONS ONLY.
# This does not set the timezone for the Python process or the database.
timezone = UTC

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The revision table that Alembic uses to track applied revisions.
version_table = alembic_version

# Migration script directory (the directory containing env.py + versions/).
script_location = alembic

# Fallback URL for the sync CLI path. env.py prefers SHURLY_DATABASE_URL.
sqlalchemy.url = postgresql://shurly:shurly@localhost:5432/shurly

# sys.path entry so that `app` is importable from this directory.
prepend_sys_path = .

# A generic .ini-style config file section for Alembic to store arbitrary
# values.
[post_write_hooks]
