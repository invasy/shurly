name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest (coverage gate)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
        env:
          SHURLY_ENVIRONMENT: test

  helm:
    name: helm lint · template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Helm lint
        run: helm lint helm/

      - name: Helm template
        run: helm template shurly helm/ > /dev/null

  docker:
    name: build image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --target runtime -f Dockerfile -t shurly:ci .
