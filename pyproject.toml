[project]
name = "shurly"
version = "0.1.0"
description = "Scalable URL shortener service with Redis caching, analytics, and rate limiting"
authors = [
    { name = "Vasiliy Polyakov", email = "job@vpolyakov.cv" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "celery>=5.3,<6.0",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "bcrypt>=4.1,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-redis>=4.6",
    "pre-commit>=3.7,<4.0",
    "locust>=2.29,<3.0",
    "aiosqlite>=0.20,<1.0",
    "fakeredis>=2.21,<3.0",
    "lupa>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # naming
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return statements
    "PL",   # pylint
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit (security)
    "T20",  # print statements
]
ignore = [
    "S101",     # allow assert (needed in tests)
    "S104",     # allow bind to 0.0.0.0 in dev
    "PLR0913",  # too many args (FastAPI route handlers)
    "B905",     # allow context managers on zips etc
    "PLC0415",  # lazy imports: deliberate here (circular-dependency and
                # optional-dependency guards, e.g. Celery tasks, GeoIP)
    "PLW0603",  # process-wide engine/session/cache singletons (see app/db.py)
]

# FastAPI idiom: Depends(...) calls in default arguments are the intended
# pattern, not an accidental call-in-default.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"alembic/env.py" = ["E402"]
"alembic/versions/**/*.py" = ["E501"]
"scripts/**" = ["S108", "S311", "T201"]
# Murmur3 finalization uses byte-offset thresholds (>=3/2/1) that are part of
# the canonical algorithm, not tunable magic values.
"app/services/encoding.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "asyncpg.*", "structlog.*", "prometheus_client.*", "alembic.*", "alembic.cmd.*", "alembic.config.*", "alembic.runtime.migration"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_decorators = false

# Celery's @task decorator has no usable stub; the tasks themselves are fully
# typed. Relax the decorator/def checks just for this module.
[[tool.mypy.overrides]]
module = ["app.tasks.celery_app"]
disallow_untyped_decorators = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
# Test fakes (``_FakeRedis`` / ``_FakeRequest``) intentionally substitute for
# the production types, and the ``StrEnum`` state machine can't be reasoned
# about statically across record_failure/record_success. Relax those codes
# for the suite; real bugs are still caught by the assertions at runtime.
disable_error_code = ["arg-type", "no-any-return", "comparison-overlap", "unreachable", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:build/coverage",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/tasks/celery_app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
